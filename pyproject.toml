[project]
name = "product-pilot"
version = "0.1.0"
description = "Local browser automation for preparing Pinduoduo product listings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
automation = [
  "playwright",
]
desktop = [
  "PySide6",
]
ocr = [
  "paddleocr",
]
validation = [
  "pydantic",
]
dev = [
  "pytest",
]

[project.scripts]
product-pilot = "product_pilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

